<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>

<div class="profile-container">
  <h2>My Profile</h2>

  <!-- Tabs -->
  <div class="tabs">
    <button id="profileTab" class="tab active">Profile</button>
    <button id="passwordTab" class="tab">Password</button>
  </div>

  <!-- Profile Form -->
  <form id="profileForm" class="card">
    <input type="text" id="name" placeholder="Full Name" />
    <input type="email" id="email" disabled />
    <input type="text" id="location" placeholder="Location" />

    <!-- Role Dropdown -->
    <select id="role">
      <option value="Volunteer">Volunteer</option>
      <option value="NGO">NGO</option>
      <option value="Admin">Admin</option>
    </select>

    <button type="submit" class="blue-btn">Update Profile</button>
  </form>

  <!-- Password Form -->
  <form id="passwordForm" class="card hidden">
    <input type="password" id="currentPassword" placeholder="Current Password" />
    <input type="password" id="newPassword" placeholder="New Password" />
    <button type="submit" class="blue-btn">Change Password</button>
  </form>
</div>

<script src="profile.js"></script>
</body>
</html>
