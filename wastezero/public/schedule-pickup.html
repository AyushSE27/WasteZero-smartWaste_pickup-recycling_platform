<link rel="stylesheet" href="schedule-pickup.css">

<body>
  <div class="page">
    <h1>Schedule a Pickup</h1>

    <form id="pickupForm">
      <select id="wasteType">
        <option>Paper</option>
        <option>Plastic</option>
        <option>Metal</option>
      </select>

      <input id="address" placeholder="Address" required>
      <input id="date" type="date" required>
      <input id="time" type="time" required>

      <button type="submit">Schedule Pickup</button>
    </form>
  </div>
</body>

<script>
document.getElementById("pickupForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const pickupData = {
    type: document.getElementById("wasteType").value,
    address: document.getElementById("address").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    status: "Scheduled"
  };

  // Get existing pickups from localStorage or empty array
  let pickups = JSON.parse(localStorage.getItem("pickups")) || [];

  // Add new pickup
  pickups.push(pickupData);

  // Save updated array
  localStorage.setItem("pickups", JSON.stringify(pickups));

  alert("Pickup Scheduled Successfully!");

  // Redirect to dashboard
  window.location.href = "dashboard.html";
});
</script>
