<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - WasteZero</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="logo">
    <div class="logo-icon">♻</div>
    <span>WasteZero</span>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>
</header>

<!-- ================= REGISTER CARD ================= -->
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
    </div>
    
    <h2>Create Account</h2>
    <p>Join WasteZero and start managing waste smarter</p>
   <form id="registerForm">

  <!-- FULL NAME -->
  <div class="input-group">
    <label>Full Name</label>
    <div class="input-with-icon">
      <input type="text" id="fullName" placeholder="Your full name" required>
    </div>
  </div>

  <!-- EMAIL (existing) -->
  <div class="input-group">
    <label>Email Address</label>
    <div class="input-with-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      <input type="email" id="registerEmail" placeholder="you@example.com" required>
    </div>
  </div>

  <!-- USERNAME -->
  <div class="input-group">
    <label>Username</label>
    <div class="input-with-icon">
      <input type="text" id="username" placeholder="Choose a username" required>
    </div>
  </div>

  <!-- PASSWORD (existing) -->
  <div class="input-group">
    <label>Password</label>
    <div class="input-with-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <input type="password" id="registerPassword" placeholder="••••••••" required>
    </div>
  </div>

  <!-- CONFIRM PASSWORD (existing) -->
  <div class="input-group">
    <label>Confirm Password</label>
    <div class="input-with-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <input type="password" id="confirmPassword" placeholder="••••••••" required>
    </div>
  </div>

  <!-- ROLE -->
  <div class="input-group">
    <label>Role</label>
    <select id="role" class="select-box" required>
      <option value="Volunteer">Volunteer</option>
      <option value="NGO">NGO</option>
      <option value="Admin">Admin</option>
    </select>
  </div>

  <button type="submit" class="btn-primary">Create Account</button>
</form>


<script src="script.js"></script>
</body>
</html>
