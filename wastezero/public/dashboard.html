
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - WasteZero</title>
  <link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">♻ WasteZero</div>

   <div class="user">
  <div class="avatar" id="userAvatar">U</div>
  <div>
    <strong id="userName">User</strong>
    <small id="userEmail">email@example.com</small>
  </div>
</div>

   <nav>
  <a href="dashboard.html">
    <i class="fa-solid fa-chart-line"></i> Dashboard
  </a>

  <a href="schedule-pickup.html" class="active">
    <i class="fa-solid fa-calendar-plus"></i> Schedule Pickup
  </a>

  <!-- <a href="my-pickups.html">
    <i class="fa-solid fa-box"></i> My Pickups
  </a> -->

  <a href="messages.html">
    <i class="fa-solid fa-comments"></i> Messages
  </a>

  <a href="impact.html">
   <i class="fa-solid fa-leaf"></i> My Impact
  </a>

  <a href="profile.html">
    <i class="fa-solid fa-user"></i> My Profile
  </a>
</nav>

<button class="logout">
  <i class="fa-solid fa-right-from-bracket"></i> Sign Out
</button>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">

    <h1>Dashboard</h1>
    <p>Welcome back, <span id="welcomeName">User</span></p>


    

    <div class="box">
  <h3>Recent Pickups</h3>

</div>
    <!-- STATS -->
    <div class="cards">
      <div class="card">Total Pickups<br><strong>1</strong></div>
      <div class="card">Recycled Items<br><strong>1</strong></div>
      <div class="card">CO2 Saved (Kg)<br><strong>0</strong></div>
      <div class="card">Volunteer Hours<br><strong>0</strong></div>
    </div>

    <!-- <div class="box">
  <h3>Recent Pickups</h3>
  <p id="pickupInfo">No pickups yet</p>
  <span class="badge" id="pickupStatus"></span>
</div> -->

<!-- <div class="box">
  <h3>Recent Pickups</h3>
  <div id="pickupList">No pickups yet</div>
</div> -->


  </main>
</div>

<script src="dashboard.js"></script>
</body>
</html>
